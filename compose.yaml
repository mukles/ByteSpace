services:
  postgres:
    image: postgres:17
    container_name: doin-postgres
    environment:
      POSTGRES_USER: doin
      POSTGRES_PASSWORD: doin
      POSTGRES_DB: doin
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doin -d doin"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
